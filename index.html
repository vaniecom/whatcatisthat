<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity .25s ease;
}

img.loaded {
  opacity: 1;
}
</style>
</head>
<body>
<img id="cat" alt="">

<script>
const img = document.getElementById("cat");

async function showCat() {
  img.classList.remove("loaded");

  for (let i = 0; i < 8; i++) {
    try {
      const res = await fetch(
        "https://api.thecatapi.com/v1/images/search?limit=1&mime_types=jpg,png&order=RANDOM"
      );

      if (!res.ok) continue;

      const data = await res.json();
      const url = data[0]?.url;

      if (!url) continue;

      const photo = new Image();

      const loaded = await new Promise(resolve => {
        photo.onload = () => resolve(true);
        photo.onerror = () => resolve(false);
        photo.src = url;
      });

      if (!loaded) continue;

      img.src = url;
      img.classList.add("loaded");
      return;
    } catch (e) {}
  }
}

showCat();
</script>
</body>
</html>
